name: arm-hunt

on:
  push:
    branches: [probe]

env:
  APK_URL: https://github.com/iTomKo/Outify/releases/download/2.0.0/app-universal-release.apk

jobs:
  arm:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: timeout shim (macOS has no coreutils timeout)
        run: |
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/timeout" <<'EOF'
          #!/bin/bash
          t=$1; shift
          "$@" &
          p=$!
          ( sleep "$t"; kill -9 $p 2>/dev/null ) &
          w=$!
          wait $p; rc=$?
          kill $w 2>/dev/null
          exit $rc
          EOF
          chmod +x "$HOME/bin/timeout"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Fetch latest Outify APK
        run: |
          curl -sSL --retry 3 -o outify.apk "$APK_URL"
          ls -l outify.apk

      - name: Hunt for crashes on android-14-arm64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -camera-back none -camera-front none
          script: bash scripts/hunt.sh android-14-arm64

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-hunt
          path: out/android-14-arm64
          if-no-files-found: warn
