name: Elite Memo Pro APK Reproducibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elite-memo-pro-apk-reproducibility
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify universal APK using F-Droid method
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout verification repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Elite Memo Pro source at release tag
        uses: actions/checkout@v7.0.1
        with:
          repository: deepanjanxyz/notepad
          ref: v1.0.32-rc01
          path: notepad
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      - name: Build unsigned release APK
        working-directory: notepad
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --parallel --warning-mode all

      - name: Select the universal unsigned APK
        id: built
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apks < <(
            find notepad/app/build/outputs/apk/release -maxdepth 1 -type f \
              -name '*universal*release*unsigned.apk' -print | sort
          )

          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one universal unsigned release APK; found ${#apks[@]}."
            find notepad/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
          echo "Generated universal APK: ${apks[0]}"

      - name: Download the published F-Droid APK
        run: |
          set -euo pipefail
          mkdir -p comparison
          curl --fail --location --retry 3 --retry-all-errors \
            'https://github.com/deepanjanxyz/notepad/releases/download/v1.0.32-rc01/EliteMemoPro-v1.0.32-rc01-32-universal.apk' \
            --output comparison/EliteMemoPro-v1.0.32-rc01-32-universal.apk
          test -s comparison/EliteMemoPro-v1.0.32-rc01-32-universal.apk

      - name: Install F-Droid APK signature verification tool
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/apksigcopier-venv"
          "$RUNNER_TEMP/apksigcopier-venv/bin/pip" install --disable-pip-version-check apksigcopier

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "::error::Android apksigner was not found in the installed SDK build-tools."
            exit 1
          fi
          echo "$(dirname "$apksigner")" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/apksigcopier-venv/bin" >> "$GITHUB_PATH"

      - name: Verify rebuilt APK using F-Droid signature-copy method
        id: verify
        shell: bash
        env:
          BUILT_APK: ${{ steps.built.outputs.path }}
          RELEASE_APK: comparison/EliteMemoPro-v1.0.32-rc01-32-universal.apk
        run: |
          set -euo pipefail

          echo '--- Generated unsigned APK ---'
          sha256sum "$BUILT_APK"
          stat --printf='Size: %s bytes\\n' "$BUILT_APK"

          echo '--- Published F-Droid APK ---'
          sha256sum "$RELEASE_APK"
          stat --printf='Size: %s bytes\\n' "$RELEASE_APK"

          # F-Droid copies the published APK's v1/v2/v3 signature metadata
          # onto the rebuilt unsigned APK, then verifies it with apksigner.
          # A successful verification proves the rebuilt APK matches the
          # signed reference under F-Droid's reproducible-build procedure.
          if apksigcopier compare --unsigned "$RELEASE_APK" "$BUILT_APK"; then
            echo 'result=VERIFIED' >> "$GITHUB_OUTPUT"
            echo 'F-DROID REPRODUCIBLE BUILD VERIFICATION PASSED'
          else
            echo 'result=NOT_VERIFIED' >> "$GITHUB_OUTPUT"
            echo '::error title=F-DROID VERIFICATION FAILED::The rebuilt APK does not verify against the published F-Droid APK signature.'
            exit 1
          fi

      - name: Upload both universal APKs for inspection
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: elite-memo-pro-v1.0.32-rc01-universal-apk-verification
          path: |
            ${{ steps.built.outputs.path }}
            comparison/EliteMemoPro-v1.0.32-rc01-32-universal.apk
          if-no-files-found: ignore
          retention-days: 7
